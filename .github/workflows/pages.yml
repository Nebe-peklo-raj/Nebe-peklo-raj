name: Deploy web to GitHub Pages

# Publishes only the website files, not docs/, data/, src/, tests/ or other repo files.
# Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect website files
        env:
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
        run: |
          mkdir _site
          cp *.html robots.txt sitemap.xml .nojekyll _site/
          cp -r assets _site/
          python3 -c 'import json,os; open("_site/assets/mapy-config.js","w",encoding="utf-8").write("window.MAPY_API_KEY = " + json.dumps(os.environ.get("MAPY_API_KEY","")) + ";\\n")'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
